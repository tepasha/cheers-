<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Liquid & Glow Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Foam Gradient -->
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="12"/>

  <!-- Subtle Radial Inner Glow -->
  <circle cx="256" cy="240" r="180" fill="#F59E0B" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Glass (Tilted right for clinking toast) -->
  <g transform="translate(195, 275) rotate(14) translate(-70, -110)">
    <!-- Glass Outline & Liquid -->
    <path d="M 20 40 L 35 150 C 37 175 55 190 75 190 C 95 190 113 175 115 150 L 130 40 Z" 
          fill="url(#liquidGrad)" stroke="#FDE68A" stroke-width="6" stroke-linejoin="round"/>
    <!-- Glass Stem -->
    <path d="M 75 190 L 75 240 M 45 240 L 105 240" 
          stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
    <!-- Liquid Highlight / Reflection -->
    <path d="M 38 60 L 46 140 C 48 155 58 165 72 165" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Right Glass (Tilted left for clinking toast) -->
  <g transform="translate(315, 275) rotate(-14) translate(-70, -110)">
    <!-- Glass Outline & Liquid -->
    <path d="M 20 40 L 35 150 C 37 175 55 190 75 190 C 95 190 113 175 115 150 L 130 40 Z" 
          fill="url(#liquidGrad)" stroke="#FDE68A" stroke-width="6" stroke-linejoin="round"/>
    <!-- Glass Stem -->
    <path d="M 75 190 L 75 240 M 45 240 L 105 240" 
          stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
    <!-- Liquid Highlight / Reflection -->
    <path d="M 112 60 L 104 140 C 102 155 92 165 78 165" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Clink Flash & Sparkles in the Center -->
  <g transform="translate(256, 175)">
    <!-- Central Burst Star -->
    <path d="M 0 -36 Q 4 -8 36 0 Q 4 8 0 36 Q -4 8 -36 0 Q -4 -8 0 -36 Z" 
          fill="#FFFBEB" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    
    <!-- Sparkles -->
    <circle cx="-50" cy="-35" r="4" fill="#FDE68A"/>
    <circle cx="48" cy="-42" r="5" fill="#FDE68A"/>
    <circle cx="-35" cy="40" r="3.5" fill="#FCD34D"/>
    <circle cx="42" cy="35" r="4" fill="#FCD34D"/>
  </g>

  <!-- Bubbles rising -->
  <circle cx="215" cy="235" r="5" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="225" cy="205" r="3.5" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="295" cy="240" r="4.5" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="285" cy="210" r="3" fill="#FEF3C7" opacity="0.7"/>

  <!-- App Label "БУДЬМО!" at the bottom -->
  <text x="256" y="440" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#goldBorder)">БУДЬМО!</text>
</svg>
