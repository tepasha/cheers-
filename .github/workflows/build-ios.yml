name: 🍏 iOS build (reusable)

# Called by release.yml (manual), or started by hand. EAS builds in the cloud (no macOS runner).
# Nothing is published to GitHub Releases; the EAS output is summarised, never printed or uploaded whole.
# A production build (a TestFlight build is an App Store candidate) comes only from main or a release tag on main,
# after the full CI; a preview build must be configured for the staging backend (GitHub Environment `staging`).
on:
  # A caller sets ci_checked only after its CI gate succeeds; an independent manual run performs CI below.
  workflow_call:
    inputs:
      ci_checked:
        description: 'Caller has successfully completed ci-check.yml for this commit'
        type: boolean
        default: false
      profile:
        description: 'EAS profile: production (TestFlight) or preview (internal)'
        type: string
        default: 'production'
      submit:
        description: 'Send a production build to TestFlight (needs the ASC_APP_ID variable)'
        type: boolean
        default: true
    secrets:
      EXPO_TOKEN:
        required: true
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профіль збірки (production: TestFlight / App Store, preview: внутрішній тест)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Завантажити production-збірку в Apple TestFlight (потрібна змінна ASC_APP_ID)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Any TestFlight build can be picked for App Store review, so production is built only from main or a release tag
  # whose commit is on main (scripts/release-check.mjs --release-ref). Preview passes straight through.
  gate:
    name: 🚦 Production only from main or a release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        if: inputs.profile == 'production'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the "is this commit on main" check needs main's history

      - name: 🟢 Setup Node.js 22
        if: inputs.profile == 'production'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 🚦 main or a release tag on main
        if: inputs.profile == 'production'
        run: node scripts/release-check.mjs --release-ref

  # Started by hand, nothing has tested this ref yet: run the same CI as every release. A caller (release.yml) has
  # run ci-check.yml already, so it is skipped then.
  ci:
    name: ✅ CI gate
    needs: gate
    if: ${{ !inputs.ci_checked }}
    uses: ./.github/workflows/ci-check.yml

  # Every non-production client talks to the staging backend: see the same job in build-android.yml
  staging:
    name: 🎯 Staging backend
    needs: gate
    if: inputs.profile != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    outputs:
      project: ${{ steps.target.outputs.project }}
      database: ${{ steps.target.outputs.database }}
    steps:
      - name: 🎯 Staging backend is configured
        id: target
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$DATABASE_ID" ]; then
            echo "::error::The GitHub Environment 'staging' has no FIREBASE_PROJECT_ID / FIRESTORE_DATABASE_ID. Preview builds must talk to the staging backend, so none is built until it is configured (see DEPLOY.md)."
            exit 1
          fi
          echo "project=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "database=$DATABASE_ID" >> "$GITHUB_OUTPUT"

  build-ios:
    name: 🍏 Build iOS (${{ inputs.profile }})
    needs: [gate, ci, staging]
    # A skipped CI is accepted only when another workflow called this one (and ran ci-check.yml itself);
    # a skipped staging job only for a production build
    if: >-
      !cancelled() && needs.gate.result == 'success'
      && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && inputs.ci_checked))
      && (needs.staging.result == 'success' || (needs.staging.result == 'skipped' && inputs.profile == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏷️ Project is linked to EAS
        run: node scripts/release-check.mjs --project

      # Validate the profile's Plain text / Sensitive EAS variables before queueing a build. Preview allows missing
      # legal links, support email, Sentry and real AdMob app ids; Firebase/Google remain required. Production requires
      # everything. app.config.ts repeats the check on the build worker. Secret variables remain unsuitable for runtime
      # config: OTA updates cannot read them.
      - name: 🔐 EAS environment is complete
        run: eas env:exec "$PROFILE" "node scripts/release-check.mjs --env --platform ios --profile $PROFILE" --non-interactive

      # The app's Firebase project and named database must be the staging backend's (see build-android.yml)
      - name: 🎯 The preview app talks to the staging backend
        if: inputs.profile != 'production'
        env:
          EXPECTED_FIREBASE_PROJECT_ID: ${{ needs.staging.outputs.project }}
          EXPECTED_FIRESTORE_DATABASE_ID: ${{ needs.staging.outputs.database }}
        run: eas env:exec "$PROFILE" 'node scripts/release-check.mjs --backend' --non-interactive

      # eas-cli reads an App Store Connect API key only from EXPO_ASC_API_KEY_PATH / EXPO_ASC_KEY_ID /
      # EXPO_ASC_ISSUER_ID, from the submit profile in eas.json, or from the EAS credentials service; it never looks
      # for a decoded file on its own. In --non-interactive mode it also needs EXPO_APPLE_TEAM_ID (it would prompt
      # for it otherwise). Without the key EAS cannot create or repair the provisioning profile and cannot submit,
      # and it only finds that out after the cloud build has started, so every value is checked here first.
      # The key is decoded outside the workspace, so it can never end up in the project archive EAS uploads, and
      # only its path (never the key) is handed to the later steps.
      - name: 🔑 App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          KEY_DIR: ${{ runner.temp }}/asc
        run: |
          missing=""
          [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] || missing="$missing secret APP_STORE_CONNECT_API_KEY_BASE64,"
          [ -n "$APP_STORE_CONNECT_KEY_ID" ] || missing="$missing secret APP_STORE_CONNECT_KEY_ID,"
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || missing="$missing secret APP_STORE_CONNECT_ISSUER_ID,"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing variable APPLE_TEAM_ID,"
          if [ -n "$missing" ]; then
            echo "::error::iOS builds need the App Store Connect API key in CI. Missing:${missing%,}. See DEPLOY.md, stage 0, step 3."
            exit 1
          fi
          # The formats eas.json's schema enforces; the values themselves are never printed
          if ! echo "$APP_STORE_CONNECT_KEY_ID" | grep -qE '^[0-9A-Z]{1,30}$'; then
            echo "::error::APP_STORE_CONNECT_KEY_ID must be the key id from App Store Connect (uppercase letters and digits, e.g. AB32CZE81F)"
            exit 1
          fi
          if ! echo "$APP_STORE_CONNECT_ISSUER_ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::APP_STORE_CONNECT_ISSUER_ID must be the Issuer ID (a UUID) shown above the key list in App Store Connect → Users and Access → Integrations"
            exit 1
          fi
          if ! echo "$APPLE_TEAM_ID" | grep -qE '^[0-9A-Z]{10}$'; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Apple Developer team id"
            exit 1
          fi
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          if ! echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey.p8" 2>/dev/null \
             || ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_DIR/AuthKey.p8"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 is not a base64-encoded .p8 key (encode it with: base64 -w0 AuthKey_<id>.p8)"
            exit 1
          fi
          chmod 600 "$KEY_DIR/AuthKey.p8"
          echo "✅ App Store Connect API key is ready"

      # Only validates. eas.json is NOT edited before the build: it is one of the files hashed into the fingerprint
      # runtime version (app.config.ts), so a CI-edited eas.json would give the store binary a runtime version that
      # no OTA update published from a clean checkout (ota.yml) could ever match. The TestFlight identifiers are
      # written into eas.json only by the submit step, after the binary exists.
      - name: 🍎 TestFlight target
        id: target
        env:
          SUBMIT_REQUESTED: ${{ inputs.submit }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          if [ "$SUBMIT_REQUESTED" != "true" ]; then
            echo "submit=false" >> "$GITHUB_OUTPUT"
          elif [ "$PROFILE" != "production" ]; then
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The $PROFILE profile builds for internal (ad hoc) distribution, which TestFlight does not accept: the build is not submitted"
          elif [ -z "$ASC_APP_ID" ]; then
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC_APP_ID не задана як змінна репозиторію: збірку буде створено без відправки в TestFlight"
          elif ! echo "$ASC_APP_ID" | grep -qE '^[0-9]{1,30}$'; then
            echo "::error::ASC_APP_ID must be the numeric Apple ID of the app (App Store Connect → App Information)"
            exit 1
          else
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔨 EAS Build for iOS
        id: build
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          echo "🚀 Запуск збірки iOS для профілю: $PROFILE"
          # No --auto-submit: submission is a separate step after the build (see "TestFlight target" for why).
          # The result is kept outside the workspace and never uploaded or printed in full.
          if eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            --json > "$RUNNER_TEMP/ios-build-result.json"; then
            BUILD_EXIT=0
          else
            BUILD_EXIT=$?
          fi

          {
            echo "### 🍏 iOS ($PROFILE)"
            if jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/ios-build-result.json" > /dev/null 2>&1; then
              jq -r '.[] | "- збірка `\(.id)`: **\(.status)** — [відкрити в EAS](\(.buildDetailsPageUrl))"' "$RUNNER_TEMP/ios-build-result.json"
            else
              echo "- EAS не повернув результат збірки, див. лог кроку"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::eas build failed (exit $BUILD_EXIT), see the log above"
            exit "$BUILD_EXIT"
          fi
          echo "id=$(jq -r '.[0].id' "$RUNNER_TEMP/ios-build-result.json")" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.[0].status' "$RUNNER_TEMP/ios-build-result.json")" >> "$GITHUB_OUTPUT"

      # The submit profile gets its identifiers only now, after the build: editing eas.json at this point cannot
      # change the binary's runtime version any more. The key fields are written as "$VAR" references, which eas-cli
      # expands from the environment (it does so for ascApiKeyPath, ascApiKeyId and ascApiKeyIssuerId), so the key id
      # and issuer id never land in a file. EAS Submit needs the key in the profile: for the upload itself it does not
      # read EXPO_ASC_* and would otherwise look for a key stored on EAS (and fail in --non-interactive mode).
      - name: 🚀 Submit to TestFlight
        if: steps.target.outputs.submit == 'true'
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_ID: ${{ steps.build.outputs.id }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        run: |
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ] || [ "$BUILD_STATUS" != "FINISHED" ]; then
            echo "::error::The build did not finish (status: ${BUILD_STATUS:-unknown}), nothing to submit"
            exit 1
          fi
          jq --arg app "$ASC_APP_ID" --arg team "$APPLE_TEAM_ID" '
            .submit.production.ios += {
              ascAppId: $app,
              appleTeamId: $team,
              ascApiKeyPath: "$EXPO_ASC_API_KEY_PATH",
              ascApiKeyId: "$EXPO_ASC_KEY_ID",
              ascApiKeyIssuerId: "$EXPO_ASC_ISSUER_ID"
            }' eas.json > "$RUNNER_TEMP/eas.json"
          mv "$RUNNER_TEMP/eas.json" eas.json
          eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive
          echo "- TestFlight: збірку \`$BUILD_ID\` відправлено" >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
