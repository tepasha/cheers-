name: 🍏 iOS build (reusable)

# Called by release.yml (tag) and preview.yml (main), or started by hand. EAS builds in the cloud (no macOS runner).
# Nothing is published to GitHub Releases; the EAS output is summarised, never printed or uploaded whole.
on:
  workflow_call:
    inputs:
      profile:
        description: 'EAS profile: production (TestFlight) or preview (internal)'
        type: string
        default: 'production'
      submit:
        description: 'Send the build to TestFlight (needs the ASC_APP_ID and APPLE_TEAM_ID variables)'
        type: boolean
        default: true
    secrets:
      EXPO_TOKEN:
        required: true
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профіль збірки (production: TestFlight / App Store, preview: внутрішній тест)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Автоматично завантажити в Apple TestFlight (потрібні змінні ASC_APP_ID та APPLE_TEAM_ID)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: 🍏 Build iOS (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏷️ Project is linked to EAS
        run: node scripts/release-check.mjs --project

      - name: ⚙️ Configure App Store Connect API Key
        if: ${{ inputs.submit }}
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            mkdir -p private_keys
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            echo "✅ App Store Connect AuthKey збережено"
          else
            echo "ℹ️ Використовуються ключі, збережені в Expo EAS"
          fi

      # The App Store identifiers are not committed (the old values in eas.json were placeholders). They come from
      # repository variables (Settings → Secrets and variables → Actions → Variables) and are injected here.
      - name: 🍎 Configure TestFlight target
        id: submit
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_APP_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            jq --arg app "$ASC_APP_ID" --arg team "$APPLE_TEAM_ID" \
              '.submit.production.ios.ascAppId = $app | .submit.production.ios.appleTeamId = $team' \
              eas.json > "$RUNNER_TEMP/eas.json" && mv "$RUNNER_TEMP/eas.json" eas.json
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC_APP_ID / APPLE_TEAM_ID не задані як змінні репозиторію: збірку буде створено без відправки в TestFlight"
          fi

      - name: 🔨 EAS Build for iOS
        env:
          TESTFLIGHT_CONFIGURED: ${{ steps.submit.outputs.configured }}
          SUBMIT_REQUESTED: ${{ inputs.submit }}
        run: |
          AUTO_SUBMIT_FLAG=""
          if [ "$TESTFLIGHT_CONFIGURED" = "true" ] && [ "$SUBMIT_REQUESTED" = "true" ]; then
            AUTO_SUBMIT_FLAG="--auto-submit"
          fi

          echo "🚀 Запуск збірки iOS для профілю: $PROFILE"
          # Kept outside the workspace and never uploaded or printed in full
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            $AUTO_SUBMIT_FLAG \
            --json > "$RUNNER_TEMP/ios-build-result.json"

          {
            echo "### 🍏 iOS ($PROFILE)"
            jq -r '.[] | "- збірка `\(.id)`: **\(.status)** — [відкрити в EAS](\(.buildDetailsPageUrl))"' "$RUNNER_TEMP/ios-build-result.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Remove the App Store Connect key
        if: always()
        run: rm -rf private_keys
