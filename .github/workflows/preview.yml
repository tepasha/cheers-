name: 🧪 Preview (main)

# Every merge to main: CI gate, then the staging backend, and, once the repository variable PREVIEW_BUILDS is 'true'
# (set it after `eas init`, the EAS variables and the staging environment exist), an internal Android build and a
# preview OTA update. iOS preview builds need registered test devices, so they stay a manual run of build-ios.yml.
#
# The preview clients talk to the staging backend: build-android.yml and ota.yml refuse an EAS `preview` environment
# whose Firebase project / database differ from the GitHub Environment `staging` (see DEPLOY.md).
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    name: ✅ CI gate
    uses: ./.github/workflows/ci-check.yml

  # Deployed on EVERY push, not only when firestore.rules / functions changed: a diff against the previous push
  # loses a change whenever that push's run was cancelled (a newer push queues behind it) or failed, and staging then
  # kept the old rules until the next backend change, while the preview clients already expected the new ones.
  # A full deploy is cheap: the rules are one file, and firebase-tools skips functions whose source is unchanged.
  backend:
    name: ☁️ Backend → staging
    needs: ci
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: staging
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  # The backend first, as in a release: the preview clients of this commit may rely on its rules and functions, so
  # they are built and published only after the staging deploy has succeeded.
  android:
    name: 🤖 Android preview build
    needs: [ci, backend]
    if: vars.PREVIEW_BUILDS == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      profile: preview
      submit: false
    secrets: inherit

  ota:
    name: 📡 OTA → preview channel
    needs: [ci, backend]
    if: vars.PREVIEW_BUILDS == 'true'
    uses: ./.github/workflows/ota.yml
    with:
      channel: preview
    secrets: inherit
