name: 🧪 Preview (stage)

# Every push to the `stage` branch: CI gate, internal Android build, then a preview OTA update, all on expo.dev only.
# Nothing is deployed to Firebase here: the staging backend is deployed by hand (deploy-backend.yml), and the
# comparison of EAS `preview` with the GitHub Environment `staging` is skipped, so this line needs only EXPO_TOKEN and
# the EAS `preview` environment. A push to main runs only CI (ci-check.yml).
# iOS preview builds need registered test devices, so they stay a manual run of build-ios.yml.
on:
  push:
    branches: [ stage ]
  workflow_dispatch:

permissions:
  contents: read

# Keep the whole pipeline in commit order: an older build must not publish after a newer update.
concurrency:
  group: expo-preview-stage
  cancel-in-progress: false

jobs:
  ci:
    name: ✅ CI gate
    uses: ./.github/workflows/ci-check.yml

  android:
    name: 🤖 Android preview build
    needs: ci
    uses: ./.github/workflows/build-android.yml
    with:
      ci_checked: true
      skip_backend_check: true
      profile: preview
      submit: false
    secrets: inherit

  ota:
    name: 📡 OTA → preview channel
    needs: [ci, android]
    uses: ./.github/workflows/ota.yml
    with:
      ci_checked: true
      skip_backend_check: true
      channel: preview
    secrets: inherit
