name: 📣 Promote to production (stores)

# Takes an already tested build out to real users. Always started by hand and held by the GitHub Environment
# `store-release` (add required reviewers in Settings → Environments).
#   Android  submits the chosen EAS build to the Google Play production track with a staged rollout
#   iOS      pushes the store listing (store.config.json). EAS cannot press "Submit for Review": do that in
#            App Store Connect once the TestFlight build is verified.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      build_id:
        description: 'Android: id збірки EAS (production AAB, яка вже пройшла internal-тест)'
        required: false
        type: string
      rollout:
        description: 'Android: частка користувачів на старті (0.01 – 1)'
        required: true
        default: '0.1'
        type: string

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  promote:
    name: 📣 Promote (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: store-release
    env:
      PLATFORM: ${{ inputs.platform }}
      BUILD_ID: ${{ inputs.build_id }}
      ROLLOUT: ${{ inputs.rollout }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏷️ Project is linked to EAS
        run: node scripts/release-check.mjs --project

      - name: 🤖 Submit to the Google Play production track
        if: env.PLATFORM == 'android'
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$BUILD_ID" ]; then
            echo "::error::build_id is required for Android: use the production build that passed internal testing (not 'latest', which could be a preview APK)"
            exit 1
          fi
          if ! echo "$ROLLOUT" | grep -qE '^(0(\.[0-9]+)?|1(\.0+)?)$' || [ "$ROLLOUT" = "0" ]; then
            echo "::error::rollout must be a fraction above 0 and at most 1"
            exit 1
          fi
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-service-account.json
          fi
          jq --argjson r "$ROLLOUT" '.submit["production-release"].android.rollout = $r' eas.json > "$RUNNER_TEMP/eas.json"
          mv "$RUNNER_TEMP/eas.json" eas.json
          eas submit --platform android --profile production-release --id "$BUILD_ID" --non-interactive

      - name: 🍏 Push the App Store listing
        if: env.PLATFORM == 'ios'
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          # The legal pages are public URLs, not secrets: keep them as variables of the environment
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            mkdir -p private_keys
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          fi
          node scripts/release-check.mjs --store
          eas metadata:push --non-interactive
          echo "::notice::The listing is updated. Press 'Submit for Review' in App Store Connect after checking the TestFlight build."

      - name: 🧹 Remove store keys
        if: always()
        run: rm -rf google-service-account.json private_keys
