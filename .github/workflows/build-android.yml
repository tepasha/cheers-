name: 🤖 Android - Build & Release (APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профіль збірки (preview: APK для встановлення / production: AAB для Google Play)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      release_tag:
        description: 'Тег версії (наприклад: v1.0.0)'
        required: false
        default: 'v1.0.0'
      submit_to_play_store:
        description: 'Автоматично відправити в Google Play Console'
        required: false
        default: false
        type: boolean
      publish_to_release:
        description: 'Зберегти збірку у вкладку GitHub Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android (${{ github.event.inputs.profile || 'release' }})
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 🔑 Configure Google Play Service Account
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-service-account.json
            echo "✅ Google Service Account JSON налаштовано"
          else
            echo "ℹ️ Використовуються ключі, збережені в Expo EAS"
          fi

      - name: 🏷️ Determine Tag & Profile
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag || 'v1.0.0' }}"
            PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PROFILE="production"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "profile=${PROFILE}" >> $GITHUB_OUTPUT

      - name: 🔨 EAS Build for Android
        id: build
        run: |
          AUTO_SUBMIT_FLAG=""
          if [ "${{ github.event.inputs.submit_to_play_store }}" = "true" ]; then
            AUTO_SUBMIT_FLAG="--auto-submit"
          fi

          echo "🚀 Запуск збірки Android для профілю: ${{ steps.vars.outputs.profile }}"
          eas build \
            --platform android \
            --profile "${{ steps.vars.outputs.profile }}" \
            --non-interactive \
            $AUTO_SUBMIT_FLAG \
            --json > android-build-result.json
          
          cat android-build-result.json

      - name: 📤 Upload Build Metadata Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ steps.vars.outputs.profile }}-metadata
          path: android-build-result.json
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases Tab
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_to_release == true || github.event.inputs.publish_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Будьмо! Android ${{ steps.vars.outputs.tag }} (${{ steps.vars.outputs.profile }})"
          files: |
            android-build-result.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
