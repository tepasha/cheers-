name: 🤖 Android build (reusable)

# Called by release.yml (tag) and preview.yml (main), or started by hand.
# EAS builds in the cloud; nothing is published to GitHub Releases. The EAS output contains artifact links, so it is
# summarised (id, status, link to the EAS page) and never uploaded or printed whole.
on:
  workflow_call:
    inputs:
      profile:
        description: 'EAS profile: preview (APK) or production (AAB)'
        type: string
        default: 'preview'
      submit:
        description: 'Send the build to Google Play (internal track)'
        type: boolean
        default: false
    secrets:
      EXPO_TOKEN:
        required: true
      GOOGLE_SERVICE_ACCOUNT_BASE64:
        required: false
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профіль збірки (preview: APK для встановлення / production: AAB для Google Play)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      submit:
        description: 'Автоматично відправити в Google Play (internal track)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: 🤖 Build Android (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏷️ Project is linked to EAS
        run: node scripts/release-check.mjs --project

      - name: 🔑 Configure Google Play Service Account
        if: ${{ inputs.submit }}
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-service-account.json
            echo "✅ Google Service Account JSON налаштовано"
          else
            echo "ℹ️ Використовуються ключі, збережені в Expo EAS"
          fi

      - name: 🔨 EAS Build for Android
        env:
          SUBMIT_REQUESTED: ${{ inputs.submit }}
        run: |
          AUTO_SUBMIT_FLAG=""
          if [ "$SUBMIT_REQUESTED" = "true" ]; then
            AUTO_SUBMIT_FLAG="--auto-submit"
          fi

          echo "🚀 Запуск збірки Android для профілю: $PROFILE"
          # Kept outside the workspace and never uploaded or printed in full
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            $AUTO_SUBMIT_FLAG \
            --json > "$RUNNER_TEMP/android-build-result.json"

          {
            echo "### 🤖 Android ($PROFILE)"
            jq -r '.[] | "- збірка `\(.id)`: **\(.status)** — [відкрити в EAS](\(.buildDetailsPageUrl))"' "$RUNNER_TEMP/android-build-result.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Remove the service account key
        if: always()
        run: rm -f google-service-account.json
