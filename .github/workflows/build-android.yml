name: 🤖 Android - Build & Release (APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профіль збірки (preview: APK для встановлення / production: AAB для Google Play)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      submit_to_play_store:
        description: 'Автоматично відправити в Google Play Console'
        required: false
        default: false
        type: boolean

# The job only reads the repository. Nothing is published to GitHub Releases: the EAS build output contains
# artifact links, so it is summarised (id, status, link to the EAS page) and never uploaded or printed whole.
permissions:
  contents: read

jobs:
  build-android:
    name: 🤖 Build Android (${{ github.event.inputs.profile || 'production' }})
    runs-on: ubuntu-latest
    env:
      # A pushed tag is a release: it builds the Play Store bundle
      PROFILE: ${{ github.event.inputs.profile || 'production' }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔑 Configure Google Play Service Account
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-service-account.json
            echo "✅ Google Service Account JSON налаштовано"
          else
            echo "ℹ️ Використовуються ключі, збережені в Expo EAS"
          fi

      - name: 🔨 EAS Build for Android
        env:
          SUBMIT_REQUESTED: ${{ github.event.inputs.submit_to_play_store == 'true' }}
        run: |
          AUTO_SUBMIT_FLAG=""
          if [ "$SUBMIT_REQUESTED" = "true" ]; then
            AUTO_SUBMIT_FLAG="--auto-submit"
          fi

          echo "🚀 Запуск збірки Android для профілю: $PROFILE"
          # Kept outside the workspace and never uploaded or printed in full
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            $AUTO_SUBMIT_FLAG \
            --json > "$RUNNER_TEMP/android-build-result.json"

          {
            echo "### 🤖 Android ($PROFILE)"
            jq -r '.[] | "- збірка `\(.id)`: **\(.status)** — [відкрити в EAS](\(.buildDetailsPageUrl))"' "$RUNNER_TEMP/android-build-result.json"
          } >> "$GITHUB_STEP_SUMMARY"
