name: CI Code Quality (Lint & Tests)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Reused as the gate of every release workflow (release.yml, preview.yml): nothing reaches a store without it
  workflow_call:

# CI only reads the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ⚡ Fast Validation, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏷️ Versions and identifiers are consistent
        run: node scripts/release-check.mjs

      - name: 🔍 ESLint & TypeScript Check
        run: npm run lint

      - name: 🧪 Run Unit Test Suite (Vitest)
        run: npm test

      - name: 📦 Verify the Metro bundle builds (Android)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
        env:
          # Placeholders: the bundle only has to build; real values live in .env / EAS variables
          FIREBASE_API_KEY: ci
          FIREBASE_PROJECT_ID: ci
          FIREBASE_APP_ID: 1:1:web:ci

      # Catches config-plugin and manifest problems before a 20-minute cloud build does (both platforms on Linux)
      - name: 🧱 Generate the native projects (expo prebuild)
        run: npx expo prebuild --no-install --clean

      - name: ☁️ Build the Cloud Functions package
        run: |
          npm ci
          npm run build
        working-directory: functions

  # The security rules are the only thing standing between users' data and the internet, so every change
  # to them (or to the client code that talks to them) must pass the emulator suites.
  rules:
    name: 🔒 Firestore security rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: ☕ Setup Java 21 (Firestore emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 📦 Install Dependencies
        run: npm ci

      # The tests import the Cloud Function sources, which need their own dependencies (firebase-admin)
      - name: 📦 Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: 🔒 Rules + client contract tests
        run: npm run test:rules
