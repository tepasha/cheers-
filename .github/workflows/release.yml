name: 🚀 Production release (manual)

# Only the Run workflow button starts the production release line:
#   CI gate → verify (versions agree, commit on main, STORE_RELEASES, Play credentials, EAS production variables)
#           → backend to production (needs approval) → Android AAB → Play internal track
# iOS is not deployed. The production backend changes HERE, on this manual run, not at promotion. Taking the build
# further (Play production rollout) is a separate, approved step: promote.yml, which never touches the backend.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  ci:
    name: ✅ CI gate
    uses: ./.github/workflows/ci-check.yml

  verify:
    name: 🏷️ Versions and production configuration
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the "is this commit on main" check needs main's history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # A tag can be pushed onto any commit, also one of an untested branch: the release goes on only when the
      # tagged commit is on main (--release-ref), before anything is deployed or built
      - name: 🏷️ release-check
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/release-check.mjs --tag "$GITHUB_REF_NAME" --project --release-ref
          else
            node scripts/release-check.mjs --project --release-ref
          fi

      # The backend job below replaces the PRODUCTION rules and functions (after approval) BEFORE the store builds run.
      # A manual run while the store side is not set up yet would therefore change production and then fail in the
      # builds: a half-release. So the whole line is off until the operator declares the store accounts ready
      # (repository variable STORE_RELEASES = 'true', DEPLOY.md stage 0), and every credential the build and submit
      # jobs need must exist. Only presence is checked here (no value is printed); the build jobs validate the formats.
      - name: 🏪 Store releases are switched on and credentials exist
        env:
          STORE_RELEASES: ${{ vars.STORE_RELEASES }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ "$STORE_RELEASES" != "true" ]; then
            echo "::error::Store releases are switched off: set the repository variable STORE_RELEASES to 'true' once the store accounts, keys and EAS variables exist (DEPLOY.md, stage 0). Nothing was deployed or built."
            exit 1
          fi
          missing=""
          [ -n "$EXPO_TOKEN" ] || missing="$missing secret EXPO_TOKEN,"
          [ -n "$GOOGLE_SERVICE_ACCOUNT_BASE64" ] || missing="$missing secret GOOGLE_SERVICE_ACCOUNT_BASE64,"
          if [ -n "$missing" ]; then
            echo "::error::A production release builds and submits the Android app, but CI lacks:${missing%,}. Nothing was deployed or built. See DEPLOY.md, stage 0."
            exit 1
          fi

      # The same EAS check the build jobs run, but before the production backend changes: a missing (or "Secret")
      # EAS production variable would otherwise surface only in the builds, after the deploy.
      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔐 EAS production environment is complete (Android)
        run: eas env:exec production 'node scripts/release-check.mjs --env --platform android' --non-interactive

  backend:
    name: ☁️ Backend → production
    needs: verify
    uses: ./.github/workflows/deploy-backend.yml
    with:
      ci_checked: true
      environment: production
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  android:
    name: 🤖 Android → Play internal
    needs: backend
    uses: ./.github/workflows/build-android.yml
    with:
      ci_checked: true
      profile: production
      submit: true
    secrets: inherit
